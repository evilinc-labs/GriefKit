name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # required to create a GitHub Release

jobs:
  build:
    name: Build all Minecraft versions
    runs-on: ubuntu-latest

    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      mod_version: ${{ steps.meta.outputs.mod_version }}
      release_name: ${{ steps.meta.outputs.release_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Strip the leading "v" from the tag (e.g. v1.0.1 → 1.0.1) and derive
      # a human-readable release title.
      - name: Extract release metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "mod_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_name=GriefKit ${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build all versions (chiseledBuild)
        run: ./gradlew chiseledBuild --no-daemon -Pmod_version=${{ steps.meta.outputs.mod_version }}

      # Upload the whole build/libs directory so the release job can attach
      # every versioned JAR even if this job and the release step are split.
      - name: Upload built JARs
        uses: actions/upload-artifact@v7
        with:
          name: release-jars
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download built JARs
        uses: actions/download-artifact@v8
        with:
          name: release-jars
          path: release-jars/

      - name: List artifacts (debug)
        run: ls -lh release-jars/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: ${{ needs.build.outputs.release_name }}
          draft: false
          prerelease: false
          generate_release_notes: true   # auto-generate changelog from commits
          files: release-jars/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
